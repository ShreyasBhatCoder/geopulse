<div class="flex flex-col gap-2">
  <p class="text-xs font-semibold text-slate-400 dark:text-zinc-500 uppercase tracking-wider px-3 mb-1">
    Active Devices
  </p>

  <ul class="list-none flex flex-col gap-1 p-0 m-0">
    @for(device of devices(); track device.id) {
      <app-device-item
        [deviceItem]="device"
        [selected]="selectedDeviceId() === device.id"
        (click)="selectDevice(device)"
      />
    } @empty {
      <li class="text-xs text-slate-400 dark:text-zinc-500 italic px-3 py-2">
        No active devices found.
      </li>
    }
  </ul>
</div>
